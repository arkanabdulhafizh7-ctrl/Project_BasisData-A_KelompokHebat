<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Pesanan - ROALSHOES</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-base="../">
  <header id="navbar"></header>
  <div class="page-head"><div class="container"><h1>Status <span class="accent">Pesanan</span></h1></div></div>

  <main class="container page-body">
    <div id="daftar-status"></div>
  </main>

  <!-- Modal pembayaran -->
  <div class="modal-bg" id="modal-bayar">
    <div class="modal">
      <h3>Pembayaran Pesanan</h3>
      <p id="info-bayar" style="margin-bottom:14px"></p>
      <div id="pesan-bayar" class="alert"></div>
      <form id="form-bayar" novalidate>
        <div class="form-group"><label for="metode">Metode Pembayaran</label>
          <select id="metode"></select></div>
        <div class="form-group"><label for="referensi">No. Referensi / Bukti Transfer</label>
          <input type="text" id="referensi" placeholder="Opsional untuk Tunai"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-sm" id="btn-tutup-bayar">Batal</button>
          <button type="submit" class="btn btn-primary btn-sm">Catat Pembayaran</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="footer"></footer>
  <script src="../config/data.js"></script>
  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/order.js"></script>
</body>
</html>
