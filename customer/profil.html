<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - ROALSHOES</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-base="../">
  <header id="navbar"></header>
  <div class="page-head"><div class="container"><h1>Profil <span class="accent">Saya</span></h1></div></div>

  <main class="container page-body">
    <div class="card" style="max-width:560px;margin:0 auto">
      <div id="pesan" class="alert"></div>
      <form id="form-profil" novalidate>
        <div class="form-group"><label for="nama">Nama Lengkap</label>
          <input type="text" id="nama"></div>
        <div class="form-group"><label for="email">Email</label>
          <input type="email" id="email" readonly></div>
        <div class="form-group"><label for="no_hp">Nomor Telepon</label>
          <input type="tel" id="no_hp"></div>
        <div class="form-group"><label for="alamat">Alamat</label>
          <textarea id="alamat" rows="3"></textarea></div>
        <div class="form-group"><label for="password_baru">Password Baru (opsional)</label>
          <input type="password" id="password_baru" placeholder="Kosongkan jika tidak diganti"></div>
        <button type="submit" class="btn btn-primary btn-block">Simpan Perubahan</button>
      </form>
    </div>
  </main>

  <footer id="footer"></footer>
  <script src="../config/data.js"></script>
  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/order.js"></script>
</body>
</html>
