<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - ROALSHOES</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-base="">
  <header id="navbar"></header>

  <main class="container">
    <div class="form-wrap card">
      <h2>Buat Akun <span class="accent">Pelanggan</span></h2>
      <p style="margin-bottom:18px">Isi data berikut untuk mulai memesan.</p>

      <div id="pesan" class="alert"></div>

      <form id="form-register" novalidate>
        <div class="form-group"><label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Nama lengkap"></div>
        <div class="form-group"><label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@email.com"></div>
        <div class="form-group"><label for="no_hp">Nomor Telepon</label>
          <input type="tel" id="no_hp" placeholder="08xxxxxxxxxx"></div>
        <div class="form-group"><label for="password">Password</label>
          <input type="password" id="password" placeholder="Minimal 6 karakter"></div>
        <div class="form-group"><label for="konfirmasi">Konfirmasi Password</label>
          <input type="password" id="konfirmasi" placeholder="Ulangi password"></div>
        <button type="submit" class="btn btn-primary btn-block">Daftar</button>
      </form>

      <p style="margin-top:16px;text-align:center">Sudah punya akun? <a class="accent" href="login.html"><strong>Masuk</strong></a></p>
    </div>
  </main>

  <footer id="footer"></footer>
  <script src="config/data.js"></script>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
